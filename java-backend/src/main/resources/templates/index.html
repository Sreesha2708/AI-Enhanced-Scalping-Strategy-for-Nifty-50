<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTRAQUANT X — Spring Boot + Thymeleaf Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        body { background-color: #060a14; color: #e2e8f0; font-family: system-ui, sans-serif; }
        .card-surface { background-color: #0b1120; border: 1px solid #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="p-4">
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
        <div>
            <h1 class="h3 mb-1 fw-bold text-white">ASTRAQUANT X</h1>
            <p class="text-secondary mb-0">AI-Enhanced Scalping Intelligence for NIFTY 50 (Academic Research Prototype)</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" onclick="runDemoPipeline()">Load Sample Data & Run Pipeline</button>
        </div>
    </div>
    <div class="row g-3 mb-4" id="kpiRow">
        <div class="col-md-3"><div class="card-surface p-3"><div class="small text-secondary">Candles Loaded</div><div class="h4 mb-0 font-monospace" id="kpiCandles">0</div></div></div>
        <div class="col-md-3"><div class="small text-secondary">Latest Close</div><div class="h4 mb-0 font-monospace" id="kpiClose">—</div></div>
        <div class="col-md-3"><div class="small text-secondary">AI Win Rate (Test)</div><div class="h4 mb-0 font-monospace text-info" id="kpiWinRate">—</div></div>
        <div class="col-md-3"><div class="small text-secondary">Classification F1</div><div class="h4 mb-0 font-monospace text-primary" id="kpiF1">—</div></div>
    </div>
    <div class="card-surface p-3">
        <canvas id="equityCanvas" height="100"></canvas>
    </div>
</div>
<script>
async function runDemoPipeline() {
    await fetch('/api/data/upload?demo=true', { method: 'POST' });
    await fetch('/api/strategy/generate-signals', { method: 'POST' });
    await fetch('/api/features/extract', { method: 'POST' });
    await fetch('/api/model/train', { method: 'POST' });
    await fetch('/api/model/predict', { method: 'POST' });
    const bt = await (await fetch('/api/backtest/run', { method: 'POST' })).json();
    const summary = await (await fetch('/api/dashboard/summary')).json();
    document.getElementById('kpiCandles').textContent = summary.totalCandles;
    document.getElementById('kpiClose').textContent = summary.latestCandle?.close ?? '—';
    document.getElementById('kpiWinRate').textContent = (bt.aiMetrics?.winRate ?? 0) + '%';
    document.getElementById('kpiF1').textContent = (bt.classificationMetrics?.f1Score ?? 0) + '%';
    new Chart(document.getElementById('equityCanvas'), {
        type: 'line',
        data: {
            labels: bt.equityCurve.map(p => p.timestamp),
            datasets: [
                { label: 'Primary Strategy', data: bt.equityCurve.map(p => p.primaryEquity), borderColor: '#64748b' },
                { label: 'AI Meta-Labeled', data: bt.equityCurve.map(p => p.aiEquity), borderColor: '#06b6d4' }
            ]
        }
    });
}
</script>
</body>
</html>
