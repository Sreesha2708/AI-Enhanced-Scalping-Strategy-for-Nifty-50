spring.application.name=ASTRAQUANT X
server.port=8080

# H2 In-Memory / File Database (Default for Quick Hackathon / Academic Demo)
spring.datasource.url=jdbc:h2:mem:astraquantdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Optional MySQL Configuration (Uncomment and configure for persistent MySQL storage)
# spring.datasource.url=jdbc:mysql://localhost:3306/astraquant_x?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=false
